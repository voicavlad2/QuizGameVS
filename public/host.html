<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game - Host</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="host-body">

    <!-- ═══ LOBBY ═══ -->
    <div id="lobby-screen" class="screen active">
        <h1>🎮 Are u a real friend?</h1>
        <div class="game-pin-display">
            <div class="label">Game PIN</div>
            <div class="pin" id="game-pin">----</div>
        </div>
        <div id="qrcode" style="margin: 1rem auto; display: flex; justify-content: center;"></div>
        <div class="player-count">
            Waiting for players... (<span id="player-count">0</span> joined)
        </div>
        <div class="players-grid" id="players-grid"></div>
        <button class="btn btn-start" id="btn-start" disabled>Start Game</button>
    </div>

    <!-- ═══ QUESTION ═══ -->
    <div id="question-screen" class="screen">
        <div class="top-bar">
            <div class="question-counter" id="question-counter">1 / 8</div>
            <div class="answer-count-display">
                <span id="answered-count">0</span>/<span id="total-players">0</span> answered
            </div>
            <div class="timer-display" id="timer-display">20</div>
            <button class="btn btn-next hidden" id="btn-next-question">Next ➤</button>
        </div>

        <div class="question-text" id="question-text"></div>
        <div class="answers-grid-host" id="answers-grid"></div>

        <div id="countdown-overlay" class="countdown-overlay hidden">
            <div class="countdown-number" id="countdown-number">3</div>
        </div>
    </div>

    <!-- ═══ GAME OVER ═══ -->
    <div id="gameover-screen" class="screen">
        <h1 class="game-over-title">🏆 Final Results!</h1>
        <div class="podium" id="podium"></div>
        <div class="leaderboard-list" id="final-leaderboard"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/host.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</body>

</html>
